<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-Week SAT Desmos Sprint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load the question bank -->
    <script src="questions.js"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        details > summary { list-style: none; cursor: pointer; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col overflow-hidden font-sans">
    
    <!-- Header -->
    <header class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center z-10 shrink-0">
        <div><h1 class="text-xl font-bold">SAT Math: Desmos Hack Sprint</h1></div>
        <!-- Timer buttons remain the same -->
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Left Panel -->
        <div class="w-1/3 bg-white border-r overflow-y-auto p-6 flex flex-col shadow-inner relative z-20">
            
            <h3 class="font-bold text-blue-900 mt-2 mb-3">Week 1: The "Auto-Solve" Core</h3>
            
            <!-- Hack 1 with Randomizer -->
            <div class="bg-gray-50 border rounded p-3 transition mb-4">
                <label class="flex items-start space-x-3 cursor-pointer mb-2">
                    <input type="checkbox" class="task-check mt-1 h-4 w-4 text-blue-600">
                    <div>
                        <span class="font-bold block text-gray-800">1. The Left vs. Right Split</span>
                        <span class="text-sm text-gray-600 block">Type equations on two lines. Click intersection.</span>
                    </div>
                </label>
                <details class="mt-2 bg-white border rounded p-2 text-sm shadow-sm group">
                    <summary class="font-semibold text-blue-700 hover:text-blue-800 flex justify-between items-center outline-none">
                        <span>📝 Practice Drills</span>
                        <span class="text-xs group-open:rotate-180 transition-transform">▼</span>
                    </summary>
                    <div class="mt-3 pl-2 border-l-2 border-blue-400">
                        <button onclick="rollQuestion('hack1', 'q-hack1')" class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded hover:bg-blue-200 transition font-bold mb-2">
                            🎲 Roll New Target
                        </button>
                        <!-- JS injects the question here -->
                        <div id="q-hack1"></div>
                    </div>
                </details>
            </div>

            <!-- Hack 2 with Randomizer -->
            <div class="bg-gray-50 border rounded p-3 transition mb-4">
                <label class="flex items-start space-x-3 cursor-pointer mb-2">
                    <input type="checkbox" class="task-check mt-1 h-4 w-4 text-blue-600">
                    <div>
                        <span class="font-bold block text-gray-800">2. The Slider Sweep (k)</span>
                        <span class="text-sm text-gray-600 block">Add slider 'k'. Drag until lines are parallel.</span>
                    </div>
                </label>
                <details class="mt-2 bg-white border rounded p-2 text-sm shadow-sm group">
                    <summary class="font-semibold text-blue-700 hover:text-blue-800 flex justify-between items-center outline-none">
                        <span>📝 Practice Drills</span>
                        <span class="text-xs group-open:rotate-180 transition-transform">▼</span>
                    </summary>
                    <div class="mt-3 pl-2 border-l-2 border-blue-400">
                        <button onclick="rollQuestion('hack2', 'q-hack2')" class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded hover:bg-blue-200 transition font-bold mb-2">
                            🎲 Roll New Target
                        </button>
                        <!-- JS injects the question here -->
                        <div id="q-hack2"></div>
                    </div>
                </details>
            </div>
            
        </div>

        <!-- Right Panel (Desmos iframe remains exactly the same) -->
        <div class="w-2/3 bg-gray-100 flex flex-col h-full relative z-10">
            <iframe class="absolute top-0 left-0 w-full h-full border-none" src="https://www.desmos.com/testing/collegeboard/graphing"></iframe>
        </div>
    </div>
</body>
</html>
